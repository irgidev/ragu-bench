[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragu-bench"
version = "0.1.0"
description = "Model-agnostic LLM benchmark and cost-aware routing for Bahasa Indonesia RAG"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Irgi Setiawan" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
